# fly.toml app configuration
app = "acme-api"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
dockerfile = "Dockerfile"

[build.args]
NODE_VERSION = "22"

[env]
PORT = "8080"
LOG_LEVEL = "info"
PUBLIC_API_URL = "https://api.acme.example"

[deploy]
release_command = "node scripts/migrate.js"
strategy = "rolling"

[processes]
app = "node dist/server.js"
worker = "node dist/worker.js"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/healthz"
timeout = "5s"

[[services]]
protocol = "tcp"
internal_port = 5000
processes = ["worker"]

[[services.ports]]
port = 5000
handlers = ["tls"]

[[services.tcp_checks]]
interval = "15s"
timeout = "2s"

[[mounts]]
source = "acme_data"
destination = "/data"
initial_size = "3gb"
processes = ["app"]

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

[[statics]]
guest_path = "/app/public"
url_prefix = "/static"
