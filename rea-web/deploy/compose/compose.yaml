# Local, disposable REA Web stack: PostgreSQL, S3-compatible storage (MinIO),
# the API and one Linux runner. Build context is the repository root.
#   docker compose -f rea-web/deploy/compose/compose.yaml up --build
# Credentials below are local development values only; never reuse them.
name: rea-web-local

services:
  postgres:
    image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
    environment:
      POSTGRES_USER: rea_web
      POSTGRES_PASSWORD: rea_web_local_only
      POSTGRES_DB: rea_web
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rea_web", "-d", "rea_web"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rea-web-local
      MINIO_ROOT_PASSWORD: rea-web-local-only-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 rea-web-local rea-web-local-only-secret && mc mb --ignore-existing local/rea-web-objects

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      REA_WEB_DATABASE_URL: postgres://rea_web:rea_web_local_only@postgres:5432/rea_web
      REA_WEB_SESSION_SECRET: local-only-session-secret-change-me-0000000000
      REA_WEB_PUBLIC_URL: http://localhost:8080
      REA_WEB_ALLOW_REGISTRATION: "true"
      REA_WEB_STORAGE_BACKEND: s3
      REA_WEB_S3_ENDPOINT: http://minio:9000
      REA_WEB_S3_REGION: us-east-1
      REA_WEB_S3_BUCKET: rea-web-objects
      REA_WEB_S3_ACCESS_KEY_ID: rea-web-local
      REA_WEB_S3_SECRET_ACCESS_KEY: rea-web-local-only-secret
      REA_WEB_S3_FORCE_PATH_STYLE: "true"
    ports:
      - "127.0.0.1:8080:8080"

  runner:
    build:
      context: ../../..
      dockerfile: rea-web/deploy/docker/runner.Dockerfile
    depends_on:
      - api
    environment:
      REA_WEB_API_URL: http://api:8080
      # Create a runner in the UI, then put its token in .env next to this file.
      REA_WEB_RUNNER_TOKEN: ${REA_WEB_RUNNER_TOKEN:?create a runner in the UI and set REA_WEB_RUNNER_TOKEN}
      REA_WEB_RUNNER_NAME: compose-linux
      REA_WEB_RUNNER_LABELS: compose,linux
      REA_WEB_REA_ROOT: /opt/rea
      REA_WEB_MODEL_PROVIDER: disabled
    profiles: ["runner"]

volumes:
  postgres-data:
  minio-data:
